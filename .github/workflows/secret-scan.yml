name: "Security: Secret Scan"

on:
  workflow_call:
    inputs:
      config:
        description: "Self-contained TOML config in the calling repository, loaded from its trusted base. Empty uses built-in rules."
        required: false
        type: string
        default: ""
      ignore-file:
        description: "Fingerprint exceptions loaded from the trusted base, never from the scanned PR."
        required: false
        type: string
        default: ".betterleaksignore"
      validate:
        description: "Check findings against provider APIs. Only findings confirmed invalid or revoked are dropped. Sends detected credentials to their providers."
        required: false
        type: boolean
        default: false
      validation-max-requests:
        description: "Maximum validation requests per provider (0 = unlimited)"
        required: false
        type: number
        default: 100
      allow-comments:
        description: "Honor betterleaks:allow and gitleaks:allow comments. They are part of the scanned change, so they are off by default."
        required: false
        type: boolean
        default: false
      base:
        description: "Optional range base; requires or defaults head. Does not change the trusted policy commit."
        required: false
        type: string
        default: ""
      head:
        description: "Optional range head. Without base, scans its reachable history."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      GIT_NO_REPLACE_OBJECTS: 1
    steps:
      - name: Check out the tested ref and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Betterleaks binary
        env:
          # Update version and SHA together. The SHA is in the release's checksums.txt
          BL_VERSION: 1.10.0
          BL_SHA256: 9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe
          # Authenticated download, so it is not subject to the anonymous rate limit
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="betterleaks_${BL_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/betterleaks-bin"
          cd "$RUNNER_TEMP/betterleaks-bin"
          gh release download "v${BL_VERSION}" --repo betterleaks/betterleaks --pattern "$tarball"
          # The tarball must match the hash pinned here, so a release asset replaced after pinning is rejected
          echo "${BL_SHA256}  $tarball" | sha256sum --check -
          tar -xzf "$tarball" betterleaks
          ./betterleaks version
          echo "$RUNNER_TEMP/betterleaks-bin" >> "$GITHUB_PATH"

      - name: Choose what to scan
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_HEAD: ${{ inputs.head }}
        run: |
          resolve() { git rev-parse --verify --quiet --end-of-options "$1^{commit}"; }
          zero=0000000000000000000000000000000000000000
          default_ref=
          if [ -n "$DEFAULT_BRANCH" ]; then default_ref="refs/remotes/origin/$DEFAULT_BRANCH"; fi
          base= head= mode=

          if [ -n "$INPUT_BASE" ] || [ -n "$INPUT_HEAD" ]; then
            head=${INPUT_HEAD:-HEAD}
            if [ -n "$INPUT_BASE" ]; then mode=range base=$INPUT_BASE; else mode=history; fi
          else
            case "$EVENT_NAME" in
              pull_request) mode=range base=$PR_BASE_SHA head=$PR_HEAD_SHA ;;
              merge_group) mode=range base=$MQ_BASE_SHA head=$MQ_HEAD_SHA ;;
              push)
                if [ "$PUSH_AFTER" = "$zero" ]; then
                  mode=skip
                  echo "::notice::Deleted ref; no new commits to scan"
                elif [ "$PUSH_BEFORE" != "$zero" ] && resolve "$PUSH_BEFORE" >/dev/null; then
                  mode=range base=$PUSH_BEFORE head=$PUSH_AFTER
                elif [ -z "$default_ref" ] || [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                  mode=history head=$PUSH_AFTER
                else
                  mode=range base=$default_ref head=$PUSH_AFTER
                fi
                ;;
              schedule|workflow_dispatch) mode=audit ;;
              *) echo "::error::Unsupported event; specify an explicit base/head range"; exit 1 ;;
            esac
          fi

          if [ -n "$head" ]; then
            head=$(resolve "$head") || { echo "::error::Scan head is not a fetched commit"; exit 1; }
          fi
          if [ -n "$base" ]; then
            base=$(resolve "$base") || { echo "::error::Scan base is not a fetched commit"; exit 1; }
          fi
          case "$mode" in
            range)
              count=$(git rev-list --count "$base..$head")
              description="$count commits, ${base:0:12}..${head:0:12}"
              if [ "$count" -eq 0 ]; then
                if [ -n "$INPUT_BASE" ]; then echo "::error::Explicit range contains no commits"; exit 1; fi
                mode=skip
              fi
              ;;
            history) description="history reachable from ${head:0:12}" ;;
            audit) description="all fetched branches and tags" ;;
            skip) description="deleted ref" ;;
          esac

          # Range overrides must not let a caller select its own policy commit.
          case "$EVENT_NAME" in
            pull_request) trusted_rev=$PR_BASE_SHA ;;
            merge_group) trusted_rev=$MQ_BASE_SHA ;;
            *) trusted_rev=${default_ref:-HEAD} ;;
          esac
          trusted=$(resolve "$trusted_rev") || { echo "::error::Trusted policy commit is not available"; exit 1; }
          {
            echo "mode=$mode"
            echo "base=$base"
            echo "head=$head"
            echo "trusted=$trusted"
            echo "description=$description"
          } >> "$GITHUB_OUTPUT"

      - name: Load policy from the trusted commit
        id: policy
        if: steps.range.outputs.mode != 'skip'
        env:
          TRUSTED: ${{ steps.range.outputs.trusted }}
          CONFIG: ${{ inputs.config }}
          IGNORE_FILE: ${{ inputs.ignore-file }}
        run: |
          policy="$RUNNER_TEMP/betterleaks-policy"
          mkdir -p "$policy/ignore"
          # The scanner reads checkout policy even when an explicit ignore path is supplied.
          rm -f .betterleaksignore .gitleaksignore .betterleaks.toml .gitleaks.toml
          inside_repo() {
            case "$1" in
              /*|..|../*|*/..|*/../*) echo "::error::Policy path must stay inside the repository"; exit 1 ;;
            esac
          }
          if [ -n "$IGNORE_FILE" ]; then
            inside_repo "$IGNORE_FILE"
            if git cat-file -e "$TRUSTED:$IGNORE_FILE" 2>/dev/null; then
              git show "$TRUSTED:$IGNORE_FILE" > "$policy/ignore/.betterleaksignore"
            fi
          fi
          printf '[extend]\nuseDefault = true\n' > "$policy/betterleaks.toml"
          if [ -n "$CONFIG" ]; then
            inside_repo "$CONFIG"
            if ! git cat-file -e "$TRUSTED:$CONFIG" 2>/dev/null; then
              echo "::error::Configured scanner policy does not exist in the trusted commit"
              exit 1
            fi
            git show "$TRUSTED:$CONFIG" > "$policy/betterleaks.toml"
          fi
          # A trusted config must not extend another file from the untrusted checkout.
          python3 - "$policy/betterleaks.toml" <<'PY'
          import pathlib, sys, tomllib
          config = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())
          extends, rule_sets = [], []
          for name, table in config.items():
              if name.casefold() == "extend":
                  if not isinstance(table, dict):
                      sys.exit("::error::Scanner extend policy must be a table")
                  if any(key.casefold() == "path" for key in table):
                      sys.exit("::error::Scanner config must be self-contained; extend.path is unsupported")
                  normalized = {key.casefold(): value for key, value in table.items()}
                  if len(normalized) != len(table):
                      sys.exit("::error::Scanner extend policy has ambiguous case-equivalent keys")
                  extends.append(normalized)
              elif name.casefold() == "rules":
                  if not isinstance(table, list):
                      sys.exit("::error::Scanner rules must be an array of tables")
                  rule_sets.append(table)
          if len(extends) > 1 or len(rule_sets) > 1:
              sys.exit("::error::Scanner policy has ambiguous case-equivalent sections")
          extend = extends[0] if extends else {}
          use_default = extend.get("usedefault", False)
          if not isinstance(use_default, bool):
              sys.exit("::error::extend.useDefault must be a TOML boolean")
          has_rules = bool(rule_sets and rule_sets[0])
          if not use_default:
              if not has_rules:
                  sys.exit("::error::Scanner config has no rules and no extend.useDefault = true; it would scan nothing")
              print("::warning::Scanner config does not set extend.useDefault = true; the built-in rules are not used")
          PY
          echo "config=$policy/betterleaks.toml" >> "$GITHUB_OUTPUT"
          echo "ignore-dir=$policy/ignore" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets
        id: scan
        if: steps.range.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.range.outputs.mode }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          DESCRIPTION: ${{ steps.range.outputs.description }}
          CONFIG_FILE: ${{ steps.policy.outputs.config }}
          IGNORE_DIR: ${{ steps.policy.outputs.ignore-dir }}
          VALIDATE: ${{ inputs.validate }}
          MAX_REQUESTS: ${{ inputs.validation-max-requests }}
          ALLOW_COMMENTS: ${{ inputs.allow-comments }}
        run: |
          case "$MODE" in
            range) revisions="$BASE..$HEAD" ;;
            history) revisions="$HEAD" ;;
            audit) revisions="--all" ;;
            *) echo "::error::Unsupported scan mode"; exit 1 ;;
          esac
          report="$RUNNER_TEMP/betterleaks-report.json"
          args=(git . --no-banner --redact --verbose --exit-code 3
            --config "$CONFIG_FILE"
            --report-format json --report-path "$report"
            --gitleaks-ignore-path "$IGNORE_DIR"
            --log-opts "--no-ext-diff --no-textconv --diff-merges=first-parent $revisions")
          if [ "$ALLOW_COMMENTS" != "true" ]; then
            args+=(--ignore-gitleaks-allow)
          fi
          if [ "$VALIDATE" = "true" ]; then
            # Drop only findings a provider confirmed are dead. Keep `none` (the rule has no validator), `unknown` and
            # `error`, so a rule without validation or a provider outage never hides a finding.
            args+=(--validation --validation-status valid,needs_validation,unknown,error,none
              --validation-max-requests "$MAX_REQUESTS")
          fi

          # Scanned filenames and commit messages must not become runner commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          set +e
          betterleaks "${args[@]}" 2>&1
          rc=$?
          set -e
          echo "::$token::"
          case "$rc" in
            0)
              echo "### Secret scan: no findings" >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              findings=$(jq 'length' "$report")
              jq -r '
                def prop: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
                def msg: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                .[] | "::error file=\(.File | prop),line=\(.StartLine),title=Secret detected::\("\(.RuleID) (commit \(.Commit[0:12]))" | msg)"
              ' "$report"
              {
                echo "### Secret scan: $findings finding$([ "$findings" -eq 1 ] || echo s)"
                echo "Scanned $DESCRIPTION. Secrets are redacted."
                echo
                echo '| Rule | File | Line | Commit | Fingerprint |'
                echo '|---|---|---|---|---|'
                jq -r '
                  def cell: tostring | gsub("[|`\r\n]"; " ");
                  .[] | "| \(.RuleID | cell) | `\(.File | cell)` | \(.StartLine) | \(.Commit[0:12]) | `\(.Fingerprint | cell)` |"
                ' "$report"
                echo
                echo 'Revoke real secrets. Request narrowly scoped exceptions in a separate, reviewed policy PR.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *) echo "::error::Betterleaks failed; scan is incomplete"; exit 1 ;;
          esac
