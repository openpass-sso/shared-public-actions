name: "Security: Secret Scan"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested ref and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Betterleaks binary
        env:
          BL_VERSION: 1.9.0
          BL_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}/betterleaks_${BL_VERSION}_linux_x64.tar.gz"
          echo "${BL_SHA256}  betterleaks.tar.gz" | sha256sum --check -
          tar -xzf betterleaks.tar.gz betterleaks
          chmod +x betterleaks
          ./betterleaks version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan new commits or audit full history
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          scanner() (
          set -eu

          cd "$(git rev-parse --show-toplevel)"
          case "${1:-history}" in
            history)
              exec betterleaks git . --no-banner --redact --verbose --log-opts="--diff-merges=first-parent HEAD"
              ;;
            range)
              if [ "$#" -ne 3 ]; then
                echo "Expected a base and head commit SHA." >&2
                exit 2
              fi
              for sha in "$2" "$3"; do
                case "$sha" in
                  ""|*[!0-9a-fA-F]*) echo "Expected a full commit SHA." >&2; exit 2 ;;
                esac
                if [ "${#sha}" -ne 40 ] && [ "${#sha}" -ne 64 ]; then
                  echo "Expected a full commit SHA." >&2
                  exit 2
                fi
                git cat-file -e "${sha}^{commit}"
              done
              exec betterleaks git . --no-banner --redact --verbose --log-opts="--diff-merges=first-parent $2..$3"
              ;;
            *)
              echo "Unsupported scan mode." >&2
              exit 2
              ;;
          esac
          )
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              scanner range "$PR_BASE_SHA" "$PR_HEAD_SHA"
              ;;
            push)
              case "$PUSH_BEFORE_SHA" in
                ''|0000000000000000000000000000000000000000)
                  scanner history
                  ;;
                *)
                  scanner range "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
                  ;;
              esac
              ;;
            *)
              scanner history
              ;;
          esac
